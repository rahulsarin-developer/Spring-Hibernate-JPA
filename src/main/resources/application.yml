spring:
  application:
    name: spring-hibernate-jpa
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/employee_db?createDatabaseIfNotExist=true}
    username: root
    password: admin
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  packages-to-scan:
    - com.project.spring_hibernate_jpa.controller
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE
      springframework:
        transaction: DEBUG